<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="conversations_title">Conversations — Admin</title>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('sc-theme')||'thermal-dark'); })();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <style>
    .conv-admin-container { display: flex; height: calc(100vh - 70px); background: var(--bg-main); border-radius: var(--r-lg); overflow: hidden; }
    .conv-list { width: 300px; background: var(--bg-card); border-right: 1px solid var(--border); overflow-y: auto; }
    .conv-list-item { padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--t); }
    .conv-list-item:hover { background: var(--bg-hover); }
    .conv-list-item.active { background: var(--accent-dim); }
    .conv-participants { font-weight: 600; margin-bottom: 4px; }
    .conv-last-msg { font-size: 0.7rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-messages { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .messages-header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
    .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { max-width: 70%; padding: 10px 14px; border-radius: var(--r-lg); font-size: 0.85rem; background: var(--bg-input); border: 1px solid var(--border); align-self: flex-start; }
    .message-meta { font-size: 0.65rem; color: var(--text-3); margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px; color: var(--text-3); }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🌡️</div>
      <div>
        <div class="sidebar-title" data-i18n="nav_dashboard">SmartClassroom</div>
        <div class="sidebar-subtitle">IoT System</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label" data-i18n="nav_main">Main</div>
      <a class="nav-item" href="/dashboard"><i class="fas fa-tachometer-alt"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
      <a class="nav-item" href="/statistics"><i class="fas fa-chart-bar"></i> <span data-i18n="nav_statistics">Statistics</span></a>
      <a class="nav-item" href="/chat"><i class="fas fa-comments"></i> <span data-i18n="nav_chat">Chat</span></a>
      <a class="nav-item" href="/profile"><i class="fas fa-user"></i> <span data-i18n="nav_profile">Profile</span></a>
      <a class="nav-item" href="/blueprints"><i class="fas fa-drafting-compass"></i> <span data-i18n="nav_blueprints">Blueprints</span></a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label" data-i18n="nav_admin">Admin</div>
      <a class="nav-item" href="/admin"><i class="fas fa-shield-alt"></i> <span data-i18n="nav_admin_panel">Admin Panel</span></a>
      <a class="nav-item" href="/settings"><i class="fas fa-users-cog"></i> <span data-i18n="nav_user_mgmt">User Management</span></a>
      <a class="nav-item active" href="/admin/conversations"><i class="fas fa-comment-dots"></i> <span data-i18n="nav_conversations">Conversations</span></a>
    </div>
    <div class="sidebar-user" onclick="logout()">
      <div class="user-avatar" id="sideAvatar">A</div>
      <div class="user-meta">
        <div class="user-name" id="sideUserName">Admin</div>
        <div class="user-role">Administrator</div>
      </div>
      <button class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="topbar-title" data-i18n="conversations_title">Conversations</div>
        <div class="topbar-sub" data-i18n="conversations_sub">Monitor all user chats</div>
      </div>
    </div>
    <div class="page-content" style="padding:0 20px 20px 20px;">
      <div class="conv-admin-container">
        <div class="conv-list" id="convList"><div class="empty-state" data-i18n="loading">Loading conversations...</div></div>
        <div class="conv-messages" id="messagesPanel"><div class="empty-state" data-i18n="select_chat">Select a conversation to view</div></div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/themes.js') }}"></script>
<script src="{{ url_for('static', filename='js/lang.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin_conversations.js') }}"></script>
<script>
window.logout = async function() {
  await fetch('/api/logout', { method:'POST', credentials:'include' }).catch(()=>{});
  window.location.href = '/login';
};
</script>
</body>
</html>

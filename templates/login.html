<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">Login — SmartClassroom</title>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('sc-theme')||'thermal-dark'); })();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-app);
      padding: 20px;
    }

    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float-blob 12s ease-in-out infinite;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent-2); bottom: -80px; left: -80px; animation-delay: -6s; }
    @keyframes float-blob {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-20px) scale(1.05); }
      66%      { transform: translate(-20px,30px) scale(0.96); }
    }

    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 36px 32px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.4), var(--accent-glow);
      animation: card-in 0.5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes card-in { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

    .auth-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .auth-logo-icon {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: var(--r-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      box-shadow: var(--accent-glow);
    }
    .auth-logo-text h1 {
      font-size: 1.2rem; font-weight: 800; color: var(--text-1); line-height: 1;
    }
    .auth-logo-text span {
      font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0.05em;
    }

    .auth-title { font-size: 1.4rem; font-weight: 800; color: var(--text-1); margin-bottom: 4px; }
    .auth-sub   { font-size: 0.82rem; color: var(--text-2); margin-bottom: 24px; }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    .test-creds {
      background: var(--bg-input);
      border: 1px dashed var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
      margin-bottom: 20px;
    }
    .test-creds-label {
      font-size: 0.65rem; font-family: var(--font-mono); color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .test-creds-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-2); margin-bottom: 4px;
    }
    .test-creds-row span { font-family: var(--font-mono); color: var(--text-1); font-size: 0.76rem; }
    .fill-btn {
      background: var(--accent-dim); color: var(--accent); border: none;
      border-radius: var(--r-sm); padding: 3px 8px; font-size: 0.72rem;
      cursor: pointer; font-family: var(--font-mono); transition: all var(--t);
    }
    .fill-btn:hover { filter: brightness(1.2); }

    .server-status {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono);
      margin-top: 16px;
    }

    .signup-link {
      text-align: center; margin-top: 20px; padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem; color: var(--text-2);
    }
    .signup-link a { color: var(--accent); font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🌡️</div>
      <div class="auth-logo-text">
        <h1 data-i18n="smartclassroom">SmartClassroom</h1>
        <span data-i18n="iot_tagline">IoT · AI · Real-Time</span>
      </div>
    </div>

    <div class="auth-title" data-i18n="welcome_back">Welcome back</div>
    <div class="auth-sub" data-i18n="sign_in_sub">Sign in to your classroom system</div>

    <div id="message" class="msg-bar" style="margin-bottom:14px;"></div>

    <div class="form-group">
      <label class="form-label" data-i18n="email_address">Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="email" class="form-input" data-i18n-placeholder="email_placeholder" placeholder="you@example.com">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" data-i18n="password">Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="password" class="form-input" data-i18n-placeholder="password_placeholder" placeholder="••••••••">
      </div>
    </div>

    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()" style="width:100%;justify-content:center;margin-top:4px;">
      <i class="fas fa-sign-in-alt"></i> <span data-i18n="sign_in">Sign In</span>
    </button>

    <div class="server-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText" data-i18n="checking_connection">Checking connection…</span>
    </div>

    <div class="signup-link">
      <span data-i18n="no_account">Don't have an account?</span> <a href="/signup" data-i18n="sign_up_here">Sign up here</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="{{ url_for('static', filename='js/themes.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
  <script>
    function fillCredentials() {
      document.getElementById('email').value    = 'azizamdouni700@gmail.com';
      document.getElementById('password').value = 'aaaaaa';
    }

    // Check server – update status text with translation
    fetch('/api/status').then(r => {
      document.getElementById('statusDot').className  = 'status-dot online';
      const connectedText = (localStorage.getItem('sc-lang') === 'fr') ? 'Connecté au serveur' : 'Connected to server';
      document.getElementById('statusText').textContent = connectedText;
    }).catch(() => {
      document.getElementById('statusDot').className  = 'status-dot offline';
      const offlineText = (localStorage.getItem('sc-lang') === 'fr') ? 'Serveur hors ligne' : 'Server offline';
      document.getElementById('statusText').textContent = offlineText;
    });

    function showMsg(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `msg-bar show ${type}`;
      setTimeout(() => el.classList.remove('show'), 3500);
    }

    async function doLogin() {
      const btn = document.getElementById('loginBtn');
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        const msg = (localStorage.getItem('sc-lang') === 'fr') ? 'Entrez email et mot de passe' : 'Enter email and password';
        showMsg(msg, 'error');
        return;
      }

      btn.disabled = true;
      const signingText = (localStorage.getItem('sc-lang') === 'fr') ? 'Connexion…' : 'Signing in…';
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${signingText}`;

      try {
        const res    = await fetch('/api/login-local', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}), credentials:'include' });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);

        const check = await fetch('/api/check-session', { credentials:'include' });
        const sess  = await check.json();
        if (!sess.authenticated) throw new Error('Session not created');

        const successMsg = (localStorage.getItem('sc-lang') === 'fr') ? 'Succès ! Redirection…' : 'Success! Redirecting…';
        showMsg(successMsg, 'success');
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch(e) {
        const errorMsg = e.message || ((localStorage.getItem('sc-lang') === 'fr') ? 'Échec de connexion' : 'Login failed');
        showMsg(errorMsg, 'error');
        btn.disabled = false;
        const signInText = (localStorage.getItem('sc-lang') === 'fr') ? 'Connexion' : 'Sign In';
        btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> ${signInText}`;
      }
    }

    // Enter key
    document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

    // Re-run status text on language change
    window.addEventListener('languageChanged', () => {
      fetch('/api/status').then(r => {
        document.getElementById('statusDot').className = 'status-dot online';
        const connectedText = (localStorage.getItem('sc-lang') === 'fr') ? 'Connecté au serveur' : 'Connected to server';
        document.getElementById('statusText').textContent = connectedText;
      }).catch(() => {
        document.getElementById('statusDot').className = 'status-dot offline';
        const offlineText = (localStorage.getItem('sc-lang') === 'fr') ? 'Serveur hors ligne' : 'Server offline';
        document.getElementById('statusText').textContent = offlineText;
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="chat_title">Chat — SmartClassroom</title>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('sc-theme')||'thermal-dark'); })();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <style>
    .chat-container {
      display: flex;
      height: calc(100vh - 70px);
      background: var(--bg-main);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .conversations-sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .conversations-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .conversations-header h3 { font-size: 0.9rem; margin-bottom: 8px; }
    .conversations-list { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      cursor: pointer; transition: all var(--t); border-bottom: 1px solid var(--border);
      position: relative;
    }
    .conv-item:hover { background: var(--bg-hover); }
    .conv-item.active { background: var(--accent-dim); }
    .conv-avatar {
      width: 36px; height: 36px; background: var(--accent-dim); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--accent); flex-shrink: 0;
    }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 0.85rem; font-weight: 600; color: var(--text-1); }
    .conv-last-msg { font-size: 0.7rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge {
      background: var(--accent); color: var(--text-inv); border-radius: 20px;
      padding: 2px 6px; font-size: 0.65rem; font-weight: 700; min-width: 20px; text-align: center;
    }
    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .chat-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message {
      max-width: 70%; padding: 10px 14px; border-radius: var(--r-lg);
      font-size: 0.85rem; line-height: 1.4;
    }
    .message-outgoing { align-self: flex-end; background: var(--accent); color: var(--text-inv); border-bottom-right-radius: 4px; }
    .message-incoming { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-1); border-bottom-left-radius: 4px; }
    .message-time { font-size: 0.6rem; color: var(--text-3); margin-top: 4px; text-align: right; }
    .chat-input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .chat-input-area input { flex: 1; }
    .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-3); text-align: center; flex-direction: column; gap: 12px; }
    .search-user { padding: 12px; border-bottom: 1px solid var(--border); }
    .search-result { max-height: 200px; overflow-y: auto; background: var(--bg-input); border-radius: var(--r-md); margin-top: 8px; }
    .search-result-item { padding: 10px; cursor: pointer; transition: background var(--t); border-bottom: 1px solid var(--border); }
    .search-result-item:hover { background: var(--bg-hover); }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🌡️</div>
      <div>
        <div class="sidebar-title" data-i18n="nav_dashboard">SmartClassroom</div>
        <div class="sidebar-subtitle">IoT System</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label" data-i18n="nav_main">Main</div>
      <a class="nav-item" href="/dashboard"><i class="fas fa-tachometer-alt"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
      <a class="nav-item" href="/statistics"><i class="fas fa-chart-bar"></i> <span data-i18n="nav_statistics">Statistics</span></a>
      <a class="nav-item active" href="/chat"><i class="fas fa-comments"></i> <span data-i18n="nav_chat">Chat</span></a>
      <a class="nav-item" href="/profile"><i class="fas fa-user"></i> <span data-i18n="nav_profile">Profile</span></a>
      <a class="nav-item" href="/blueprints"><i class="fas fa-drafting-compass"></i> <span data-i18n="nav_blueprints">Blueprints</span></a>
    </div>
    <div class="nav-section" id="adminNav" style="display:none">
      <div class="nav-section-label" data-i18n="nav_admin">Admin</div>
      <a class="nav-item" href="/admin"><i class="fas fa-shield-alt"></i> <span data-i18n="nav_admin_panel">Admin Panel</span></a>
      <a class="nav-item" href="/settings"><i class="fas fa-users-cog"></i> <span data-i18n="nav_user_mgmt">User Management</span></a>
      <a class="nav-item" href="/admin/conversations"><i class="fas fa-comment-dots"></i> <span data-i18n="nav_conversations">Conversations</span></a>
    </div>
    <div class="sidebar-user" onclick="logout()">
      <div class="user-avatar" id="sideAvatar">U</div>
      <div class="user-meta">
        <div class="user-name" id="sideUserName">Loading…</div>
        <div class="user-role" id="sideUserRole">User</div>
      </div>
      <button class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="topbar-title" data-i18n="chat_title">Chat</div>
        <div class="topbar-sub" data-i18n="chat_sub">Real‑time messaging with classroom peers</div>
      </div>
    </div>
    <div class="page-content" style="padding:0 20px 20px 20px;">
      <div class="chat-container">
        <div class="conversations-sidebar">
          <div class="conversations-header"><h3 data-i18n="conversations">Conversations</h3></div>
          <div class="search-user">
            <input type="text" id="userSearchInput" class="form-input" data-i18n-placeholder="search_user_placeholder" placeholder="Search user by name or email...">
            <div id="searchResults" class="search-result" style="display:none;"></div>
          </div>
          <div class="conversations-list" id="conversationsList">
            <div style="padding:16px;color:var(--text-3);text-align:center;" data-i18n="no_conversations">No conversations yet</div>
          </div>
        </div>
        <div class="chat-main">
          <div class="chat-header" id="chatHeader" style="display:none;">
            <div class="conv-avatar" id="chatAvatar">?</div>
            <div><div class="conv-name" id="chatUserName"></div></div>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div class="empty-chat">
              <i class="fas fa-comments" style="font-size:2rem;opacity:0.5;"></i>
              <p data-i18n="select_conversation">Select a conversation or search for a user to start chatting</p>
            </div>
          </div>
          <div class="chat-input-area" id="chatInputArea" style="display:none;">
            <input type="text" id="messageInput" class="form-input" data-i18n-placeholder="type_message" placeholder="Type a message...">
            <button class="btn btn-primary" id="sendBtn"><i class="fas fa-paper-plane"></i> <span data-i18n="send">Send</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/themes.js') }}"></script>
<script src="{{ url_for('static', filename='js/lang.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script>
window.logout = async function() {
  await fetch('/api/logout', { method:'POST', credentials:'include' }).catch(()=>{});
  window.location.href = '/login';
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="profile_title">My Profile — SmartClassroom</title>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('sc-theme')||'thermal-dark'); })();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <style>
    .profile-card { max-width: 500px; margin: 0 auto; }
    .divider { margin: 24px 0; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🌡️</div>
      <div>
        <div class="sidebar-title" data-i18n="nav_dashboard">SmartClassroom</div>
        <div class="sidebar-subtitle">IoT System</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label" data-i18n="nav_main">Main</div>
      <a class="nav-item" href="/dashboard"><i class="fas fa-tachometer-alt"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
      <a class="nav-item" href="/statistics"><i class="fas fa-chart-bar"></i> <span data-i18n="nav_statistics">Statistics</span></a>
      <a class="nav-item" href="/chat"><i class="fas fa-comments"></i> <span data-i18n="nav_chat">Chat</span></a>
      <a class="nav-item active" href="/profile"><i class="fas fa-user"></i> <span data-i18n="nav_profile">Profile</span></a>
      <a class="nav-item" href="/blueprints"><i class="fas fa-drafting-compass"></i> <span data-i18n="nav_blueprints">Blueprints</span></a>
    </div>
    <div class="nav-section" id="adminNav" style="display:none">
      <div class="nav-section-label" data-i18n="nav_admin">Admin</div>
      <a class="nav-item" href="/admin"><i class="fas fa-shield-alt"></i> <span data-i18n="nav_admin_panel">Admin Panel</span></a>
      <a class="nav-item" href="/settings"><i class="fas fa-users-cog"></i> <span data-i18n="nav_user_mgmt">User Management</span></a>
      <a class="nav-item" href="/admin/conversations"><i class="fas fa-comment-dots"></i> <span data-i18n="nav_conversations">Conversations</span></a>
    </div>
    <div class="sidebar-user" onclick="logout()">
      <div class="user-avatar" id="sideAvatar">U</div>
      <div class="user-meta">
        <div class="user-name" id="sideUserName">Loading…</div>
        <div class="user-role" id="sideUserRole">User</div>
      </div>
      <button class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="topbar-title" data-i18n="profile_title">My Profile</div>
        <div class="topbar-sub" data-i18n="profile_sub">Manage your personal information</div>
      </div>
    </div>
    <div class="page-content">
      <div class="profile-card">
        <div id="messageContainer" class="msg-bar" style="margin-bottom:14px;"></div>
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="fas fa-user-edit"></i> <span data-i18n="profile_info">Profile Information</span></div></div>
          <div class="form-group">
            <label class="form-label" data-i18n="new_name">New Name</label>
            <input type="text" id="profileName" class="form-input" placeholder="Your name">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="new_email">New Email</label>
            <input type="email" id="profileEmail" class="form-input" placeholder="you@example.com">
          </div>
          <button class="btn btn-primary" id="updateProfileBtn" style="width:100%;justify-content:center;"><i class="fas fa-save"></i> <span data-i18n="update_profile">Update Profile</span></button>
        </div>
        <div class="divider"></div>
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="fas fa-key"></i> <span data-i18n="update_password">Update Password</span></div></div>
          <div class="form-group">
            <label class="form-label" data-i18n="current_password">Current Password</label>
            <input type="password" id="oldPassword" class="form-input" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="new_password_label">New Password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 characters">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="confirm_new_password">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" class="form-input" placeholder="••••••••">
          </div>
          <button class="btn btn-primary" id="updatePasswordBtn" style="width:100%;justify-content:center;"><i class="fas fa-key"></i> <span data-i18n="update">Update</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/themes.js') }}"></script>
<script src="{{ url_for('static', filename='js/lang.js') }}"></script>
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
<script>
window.logout = async function() {
  await fetch('/api/logout', { method:'POST', credentials:'include' }).catch(()=>{});
  window.location.href = '/login';
};
</script>
</body>
</html>
